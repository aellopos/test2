<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stránka nenalezena / Page not found – Michal Kučera</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#170661">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <style>
    @font-face { font-family: "Archivo"; src: url("/assets/fonts/archivo-var.woff2") format("woff2"); font-weight: 400 800; font-stretch: 100% 125%; font-display: swap; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html { background: #170661; }
    body {
      min-height: 100svh;
      display: grid;
      place-content: center;
      padding: 40px clamp(20px, 5.2vw, 72px);
      font-family: "Archivo", system-ui, sans-serif;
      color: #f4f3fa;
      background: #170661;
    }
    main { display: grid; gap: 28px; }
    h1 { font-size: clamp(3rem, 14vw, 10rem); font-weight: 800; font-stretch: 125%; line-height: .9; letter-spacing: -.045em; }
    p { max-width: 34ch; font-size: clamp(1.1rem, 2vw, 1.4rem); line-height: 1.45; color: #b2accc; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; }
    p[lang="en"] { margin-top: -16px; font-size: clamp(1rem, 1.6vw, 1.15rem); }
    a {
      justify-self: start;
      padding: .45em .8em;
      border-radius: 4px;
      font-weight: 700;
      color: #170661;
      background: #ffd400;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #ffd400; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Tahle stránka tu není. Možná se změnila adresa, nebo se v&nbsp;odkazu objevil překlep.</p>
    <p lang="en">This page doesn’t exist. The address may have changed, or there’s a typo in the link.</p>
    <div class="links"><a href="/">Zpět na hlavní stránku</a><a href="/en/" lang="en">Back to the home page</a></div>
  </main>
</body>
</html>
